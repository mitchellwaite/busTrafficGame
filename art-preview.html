<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Preview</title>
<style>
  body { margin: 0; background: #2B2340; color: #EEE; font: 14px system-ui, sans-serif; }
  canvas { display: block; }
  .dom { display: flex; gap: 16px; align-items: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="dom">
  <img id="coin48" alt=""> coinDataURL(48)
  <img id="coin96" width="48" height="48" alt=""> coinDataURL(96) shown at 48 px
  <span id="perf"></span>
</div>
<script type="module">
import {
  PALETTE, drawLot, drawLoop, loopPoint, drawSpot, drawBus, drawBadge,
  drawPeep, drawSparkle, drawCoin, coinDataURL,
} from './src/art.js';

const W = 1480, H = 1840, CELL = 64;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dpr = Math.min(2, devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
document.getElementById('coin48').src = coinDataURL(48);
document.getElementById('coin96').src = coinDataURL(96);

const rad = (d) => (d * Math.PI) / 180;
const DIRS = { up: [0, -1, 0], right: [1, 0, 90], down: [0, 1, 180], left: [-1, 0, 270] };
function label(s, x, y, size = 15, align = 'center') {
  ctx.font = `700 ${size}px system-ui, sans-serif`;
  ctx.fillStyle = '#4A3A6E';
  ctx.textAlign = align;
  ctx.fillText(s, x, y);
}

const lot = { x: 90, y: 140, w: 6 * CELL, h: 8 * CELL };
const lotBuses = [ // nose col, nose row, dir, units (1 car, 2 van, 3 bus), colour
  [0, 0, 'up', 2, 0], [1, 2, 'down', 1, 1], [5, 0, 'right', 3, 2], [3, 3, 'left', 2, 3],
  [2, 4, 'up', 3, 4], [0, 6, 'up', 1, 5], [4, 6, 'down', 2, 6], [4, 7, 'left', 1, 7], [1, 5, 'right', 1, 8],
];
const BW = 0.84 * CELL, len = (u) => (u - 0.16) * CELL, PARK_LEN = { 1: 56, 2: 82, 3: 106 }; // as in the game
const spots = ['vip', 'open', 'open', 'open', 'open', 'locked', 'locked', 'locked'];
const parked = [[0, 0, 2, 8], [1, 4, 1, 3], [2, 2, 3, ''], [3, 7, 2, 10], [4, 8, 1, 16]]; // spot, colour, units, seats left ('' = full)
const loop = { x: 100, y: 1290, w: 640, h: 260 }, TRACK = 62, PEEP_R = 27;
const peeps = Array.from({ length: 50 }, (_, i) => ({ ...loopPoint(loop, i / 50), c: (i * 5 + (i >> 2)) % 8 }))
  .sort((a, b) => a.y - b.y); // lower peeps overlap upper ones

function draw(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#F1E6FF'; // the game's wallpaper is CSS (style.css)
  ctx.fillRect(0, 0, W, H);
  label('Bus Traffic: art preview', 40, 50, 26, 'left');

  label('6×8 lot, road 40', lot.x + lot.w / 2, 82);
  drawLot(ctx, lot, 40);
  for (const [c, r, dir, u, color] of lotBuses) {
    const [dx, dy, deg] = DIRS[dir];
    drawBus(ctx, lot.x + (c + 0.5 - (dx * (u - 1)) / 2) * CELL, lot.y + (r + 0.5 - (dy * (u - 1)) / 2) * CELL,
      BW, len(u), rad(deg), color, u);
  }

  PALETTE.forEach((p, i) => {
    const x = 640 + i * 106;
    label(p.name, x, 120);
    let y = 140;
    for (const u of [1, 2, 3]) {
      drawBus(ctx, x, y + len(u) / 2, BW, len(u), 0, i, u);
      y += len(u) + 22;
    }
  });

  const ay = 900;
  [[0, 0, 1], [90, 1, 2], [180, 2, 3], [270, 3, 2], [45, 4, 1]].forEach(([deg, c, u], i) => {
    drawBus(ctx, 120 + i * 220, ay, BW, len(u), rad(deg), c, u);
    label(deg + '°', 120 + i * 220, ay + 120);
  });
  drawBus(ctx, 1220, ay, 52, 180, time * 0.8, 5);
  label('spinning', 1220, ay + 120);
  drawBus(ctx, 1390, ay, 30, 76, -time * 1.3, 6);

  label('Spots (VIP, 4 open, 3 locked) with parked vehicles w=48', 60, 1050, 15, 'left');
  spots.forEach((t, i) => drawSpot(ctx, 60 + i * 84, 1070, 76, 112, t));
  for (const [i, c, u, text] of parked) {
    drawBus(ctx, 60 + i * 84 + 38, 1126, 48, PARK_LEN[u], 0, c, u);
    drawBadge(ctx, 60 + i * 84 + 38, 1126, 64, c, text);
  }
  label('w=24 parked-size', 1010, 1050, 15, 'left');
  [[0, 1, 0], [0, 2, 1], [0, 3, 2], [90, 2, 3], [90, 1, 6]].forEach(([deg, u, c], i) =>
    drawBus(ctx, 1030 + i * 84, 1126, 24, (u + 1) * 20, rad(deg), c, u));

  label('Loop 640×260, track 62, 50 peeps r=27', loop.x + loop.w / 2, 1240);
  drawLoop(ctx, loop, TRACK);
  for (const p of peeps) drawPeep(ctx, p.x, p.y, PEEP_R, p.c);

  PALETTE.forEach((p, i) => {
    const x = 860 + i * 78;
    label(p.name, x, 1300, 13);
    drawPeep(ctx, x, 1360, 30, i);
    drawPeep(ctx, x, 1440, 24, i);
    drawBus(ctx, x - 16, 1530, 48, 56, 0, i, 1);
    drawBus(ctx, x + 16, 1530, 48, 82, 0, i, 2);
  });

  label('Sparkle t = 0, .25, .5, .75, 1', 60, 1640, 15, 'left');
  [0, 0.25, 0.5, 0.75, 1].forEach((t, i) => {
    drawSparkle(ctx, 120 + i * 150, 1730, t);
    label('t=' + t, 120 + i * 150, 1815, 13);
  });
  drawSparkle(ctx, 900, 1730, (time % 1.2) / 1.2);
  label('live', 900, 1815, 13);
  drawCoin(ctx, 1100, 1730, 40);
  drawCoin(ctx, 1200, 1730, 16);
  label('coin', 1150, 1815, 13);
}

let frames = 0, total = 0;
requestAnimationFrame(function frame(now) {
  const t0 = performance.now();
  draw(now / 1000);
  total += performance.now() - t0;
  if (++frames === 60) {
    document.getElementById('perf').textContent = `draw ${(total / 60).toFixed(2)} ms/frame`;
    frames = total = 0;
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
